<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samiur App Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      background: #f5f7fa;
    }
    .header {
      padding: 20px;
      background: white;
    }
    .logo img {
      width: 100px;
    }
    h1 {
      margin: 10px 0 0;
    }
    .tagline {
      font-size: 18px;
      color: #333;
    }
    .button {
      margin: 20px;
    }
    .button a {
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
    }
    .image-section img {
      width: 60%;
      margin-bottom: 20px;
    }
    .stats {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 30px 0;
    }
    .stat-box {
      background: white;
      margin: 10px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      width: 120px;
    }
    .stat-box h2 {
      margin: 0;
      color: #007bff;
    }
    .stat-box p {
      margin: 5px 0 0;
      font-size: 14px;
      color: #555;
    }
    footer {
      padding: 20px;
      font-size: 14px;
      background-color: #fff;
      color: #333;
    }
    footer a {
      color: #007bff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <img src=https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1bi7n_KIqJdN-M2BnnwPVSTSnEkzgI1-ySg&usqp=CAU" alt="Story Book Logo 1">"
    </div>
    <h1>Samiur Story Book</h1>
    <p class="tagline">বাংলাদেশের সেরা গল্পের প্ল্যাটফর্ম।</p>
    <p>প্রতিদিন নতুন নতুন গল্প পড়তে এখনই ডাউনলোড করুন Samiur Story Book মোবাইল অ্যাপ।</p>
    <div class="button">
      <a href="https://tinyurl.com/Samiur-Story-Book" target="_blank">Download App</a>
    </div>
  </div>

  <div class="image-section">
    <img src=<img src="https://i.ibb.co/9ZBt8Nv/storybook1.png" alt="Story Book Logo 1"> </div>

  <div class="stats">
    <div class="stat-box">
      <h2>2.8K</h2>
      <p>Downloads</p>
    </div>
    <div class="stat-box">
      <h2>1.5K</h2>
      <p>Users</p>
    </div>
    <div class="stat-box">
      <h2>3.5K</h2>
      <p>Match Hosted</p>
    </div>
  </div>

  <footer>
    <p>© 2025 | Developed by <a href="#">SAMIUR</a></p>
  </footer>

</body>
</html>
